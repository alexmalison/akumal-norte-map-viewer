  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const geojson = JSON.parse(document.getElementById('map-data').textContent);
    // Each entry is [feature ID, donated USD, Detail lot code, shared, displayed name, recorded names].
    const donations = new Map(JSON.parse(document.getElementById('donation-data').textContent)
      .map(([id, amount, sourceCode, shared, name, names]) =>
        [id, { amount, sourceCode, shared: Boolean(shared), name, names: names || [name] }]));
    const currency = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const map = L.map('map', { preferCanvas: true, maxBoundsViscosity: 1.0 });
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxNativeZoom: 17,
      maxZoom: 20,
      attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community'
    }).addTo(map);
    const streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    });

    const macro = L.geoJSON(null, {
      style: feature => ({
        color: feature.properties.style_color,
        weight: feature.geometry.type === 'LineString' ? 4 : 2,
        dashArray: feature.properties.name.includes('approx') ? '6 4' : null,
        fillOpacity: feature.properties.name === 'M&M 100 hectares' ? 0.10 : 0,
        opacity: 0.95
      }),
      onEachFeature: bindFeature
    }).addTo(map);
    const lots = L.geoJSON(null, {
      style: feature => ({
        color: donations.get(feature.id)?.amount === 0 ? '#b91c1c' :
          feature.properties.style_color === '#000000' ? '#ffffff' : feature.properties.style_color,
        weight: 1.5,
        opacity: 0.95,
        fillColor: donations.get(feature.id)?.amount === 0 ? '#ef4444' : feature.properties.style_color,
        fillOpacity: donations.get(feature.id)?.amount === 0 ? 0.5 :
          feature.properties.style_color === '#000000' ? 0.04 : 0.30
      }),
      onEachFeature: bindFeature
    }).addTo(map);

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function bindFeature(feature, layer) {
      const p = feature.properties;
      const description = p.description ? `<div>${escapeHtml(p.description).replace(/\n/g, '<br>')}</div>` : '';
      const isLot = p.layer === 'Akumal Norte property Lots';
      const detail = isLot ? donations.get(feature.id) : null;
      const id = isLot ? lotId(p.name) : null;
      const recordedNames = detail && detail.names.length > 2
        ? `<div><b>Recorded names:</b> ${detail.names.map(escapeHtml).join('; ')}</div>` : '';
      const donated = detail
        ? `<div><b>Donated:</b> ${currency.format(detail.amount)}${detail.shared ? ' *' : ''}</div>` +
          `<small>Detail lot code: ${escapeHtml(detail.sourceCode)}${detail.shared ? ' · Total appears on multiple map shapes; do not add those labels together.' : ''}</small>`
        : isLot ? '<div>No matching Detail record</div>' : '';
      layer.bindPopup(`<strong>${escapeHtml(detail?.name || p.name)}</strong>` +
        (isLot ? `<div><b>Lot:</b> ${escapeHtml(id || p.name)}</div>` : '') +
        recordedNames + donated + description +
        `<small>${escapeHtml(p.layer)} · ${escapeHtml(feature.id)}</small>`);
      layer.bindTooltip(detail
        ? `${escapeHtml(id || p.name)} · ${escapeHtml(detail.name)} · ${currency.format(detail.amount)} donated`
        : escapeHtml(p.name), { sticky: true });
    }
    for (const feature of geojson.features) {
      (feature.properties.layer === 'Akumal Norte property Lots' ? lots : macro).addData(feature);
    }
    map.createPane('lot-label-pane');
    map.getPane('lot-label-pane').style.zIndex = 625;
    map.getPane('lot-label-pane').style.pointerEvents = 'none';
    const lotLabels = L.layerGroup().addTo(map);
    function lotId(name) {
      const match = name.match(/^(?:Lots?\s+)?((?:[FGH]?\d+[A-Z]?\??|H[A-F])(?:\s*(?:-|and)\s*[A-Z]?\d+[A-Z]?\??)?)/i);
      return match ? match[1] : null;
    }
    const labelMeasure = document.createElement('canvas').getContext('2d');
    function pointInRing(point, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const a = ring[i], b = ring[j];
        if ((a.y > point.y) !== (b.y > point.y) &&
            point.x < (b.x - a.x) * (point.y - a.y) / (b.y - a.y) + a.x) inside = !inside;
      }
      return inside;
    }
    function segmentsCross(a, b, c, d) {
      const cross = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
      const boxesOverlap = Math.max(Math.min(a.x, b.x), Math.min(c.x, d.x)) <=
          Math.min(Math.max(a.x, b.x), Math.max(c.x, d.x)) &&
        Math.max(Math.min(a.y, b.y), Math.min(c.y, d.y)) <=
          Math.min(Math.max(a.y, b.y), Math.max(c.y, d.y));
      return boxesOverlap && cross(a, b, c) * cross(a, b, d) <= 0 &&
        cross(c, d, a) * cross(c, d, b) <= 0;
    }
    function findLabelCenter(feature, width, height, bounds) {
      const geometry = feature.geometry;
      const polygons = geometry.type === 'Polygon' ? [geometry.coordinates] :
        geometry.type === 'MultiPolygon' ? geometry.coordinates : [];
      const projected = polygons.map(polygon => polygon.map(ring =>
        ring.map(([lng, lat]) => map.latLngToLayerPoint([lat, lng]))));
      const nw = map.latLngToLayerPoint(bounds.getNorthWest());
      const se = map.latLngToLayerPoint(bounds.getSouthEast());
      const offsets = [0.5, 0.35, 0.65, 0.2, 0.8];
      for (const yFraction of offsets) for (const xFraction of offsets) {
        const center = L.point(nw.x + (se.x - nw.x) * xFraction, nw.y + (se.y - nw.y) * yFraction);
        const left = center.x - width / 2, right = center.x + width / 2;
        const top = center.y - height / 2, bottom = center.y + height / 2;
        const corners = [L.point(left, top), L.point(right, top), L.point(right, bottom), L.point(left, bottom)];
        const fits = projected.some(polygon => {
          if (!corners.every(p => pointInRing(p, polygon[0]) &&
              polygon.slice(1).every(hole => !pointInRing(p, hole)))) return false;
          const rectangleEdges = corners.map((p, i) => [p, corners[(i + 1) % 4]]);
          return polygon.every(ring => ring.every((p, i) => {
            const q = ring[(i + 1) % ring.length];
            const vertexInside = p.x >= left && p.x <= right && p.y >= top && p.y <= bottom;
            return !vertexInside && (p.x === q.x && p.y === q.y ||
              rectangleEdges.every(([a, b]) => !segmentsCross(p, q, a, b)));
          }));
        });
        if (fits) return map.layerPointToLatLng(center);
      }
      return null;
    }
    function splitLotName(name) {
      const words = name.split(/\s+/);
      if (words.length < 2) return null;
      labelMeasure.font = '700 12px system-ui';
      let best = null;
      for (let i = 1; i < words.length; i++) {
        const lines = [words.slice(0, i).join(' '), words.slice(i).join(' ')];
        const width = Math.max(...lines.map(line => labelMeasure.measureText(line).width));
        if (!best || width < best.width) best = { lines, width };
      }
      return best.lines;
    }
    function labelSize(id, nameLines, amount) {
      labelMeasure.font = '700 13px system-ui';
      const idWidth = labelMeasure.measureText(id).width;
      labelMeasure.font = '700 12px system-ui';
      const otherWidth = Math.max(0, ...nameLines.map(line => labelMeasure.measureText(line).width),
        amount ? labelMeasure.measureText(amount).width : 0);
      return {
        width: Math.ceil(Math.max(idWidth, otherWidth) + 8),
        height: Math.ceil(13 * 1.05 + (nameLines.length + (amount ? 1 : 0)) * 12 * 1.05 + 8)
      };
    }
    function updateLotLabels() {
      lotLabels.clearLayers();
      if (!map.hasLayer(lots)) return;
      lots.eachLayer(layer => {
        const id = lotId(layer.feature.properties.name);
        if (!id) return;
        const donation = donations.get(layer.feature.id);
        const bounds = layer.getBounds();
        const northWest = map.latLngToLayerPoint(bounds.getNorthWest());
        const southEast = map.latLngToLayerPoint(bounds.getSouthEast());
        const width = Math.max(1, southEast.x - northWest.x);
        const height = Math.max(1, southEast.y - northWest.y);
        const amount = donation ? currency.format(donation.amount) + (donation.shared ? '*' : '') : '';
        const name = donation?.name || '';
        const wrappedName = name ? splitLotName(name) : null;
        const candidates = donation ? [
          { nameLines: [name], amount },
          ...(wrappedName ? [{ nameLines: wrappedName, amount }] : []),
          { nameLines: [], amount },
          { nameLines: [name], amount: '' },
          ...(wrappedName ? [{ nameLines: wrappedName, amount: '' }] : [])
        ] : [];
        let fitted = null;
        for (const candidate of candidates) {
          const size = labelSize(id, candidate.nameLines, candidate.amount);
          if (size.width > width || size.height > height) continue;
          const center = findLabelCenter(layer.feature, size.width, size.height, bounds);
          if (center) { fitted = { ...candidate, ...size, center }; break; }
        }
        const iconWidth = fitted?.width || width;
        const iconHeight = fitted?.height || height;
        const fontSize = fitted ? 13 :
          Math.max(1, Math.min(18, (width - 4) / (id.length * 0.62), (height - 2) * 0.75));
        const icon = L.divIcon({
          className: 'lot-label',
          html: `<span>${escapeHtml(id)}</span>` +
            (fitted ? fitted.nameLines.map(line => `<span class="lot-name">${escapeHtml(line)}</span>`).join('') : '') +
            (fitted?.amount ? `<span class="donation-amount">${escapeHtml(fitted.amount)}</span>` : ''),
          iconSize: [iconWidth, iconHeight],
          iconAnchor: [iconWidth / 2, iconHeight / 2]
        });
        const marker = L.marker(fitted?.center || bounds.getCenter(), { icon, pane: 'lot-label-pane', interactive: false, keyboard: false });
        marker.on('add', () => { marker.getElement().style.fontSize = `${fontSize}px`; });
        lotLabels.addLayer(marker);
      });
    }
    map.on('zoomend resize', updateLotLabels);
    map.on('overlayadd', event => { if (event.layer === lots) { lotLabels.addTo(map); updateLotLabels(); } });
    map.on('overlayremove', event => { if (event.layer === lots) map.removeLayer(lotLabels); });
    L.control.layers({Satellite: satellite, Streets: streets}, {'Lots': lots, 'Regions': macro}, {collapsed: false}).addTo(map);
    const legend = L.control({position: 'bottomleft'});
    legend.onAdd = () => {
      const box = L.DomUtil.create('div', 'legend');
      box.innerHTML = '<div><span class="swatch" style="background:#F4EB37"></span>Yellow · Vecinos member</div>' +
        '<div><span class="swatch" style="background:#F8971B"></span>Orange · Vecinos member owned</div>' +
        '<div><span class="swatch" style="background:#ef4444"></span>Red lot · $0 donated</div>' +
        '<div><span class="swatch" style="background:#000000"></span>Black · no category stated</div>' +
        '<div><span class="swatch" style="background:#93D7E8"></span>Blue · M&amp;M region</div>' +
        '<div><span class="swatch" style="background:#DB4436"></span>Red · Etapa I / impact line</div>' +
        '<div><span class="swatch" style="background:#EE9C96"></span>Pink · approximate regions</div>' +
        '<small>Zoom in for Detail names and totals. * Shared total; do not add labels together.</small>';
      return box;
    };
    legend.addTo(map);
    const lotBounds = lots.getBounds();
    map.fitBounds(lotBounds.pad(0.03));
    map.setMinZoom(map.getZoom());
    map.setMaxBounds(map.getBounds().pad(0.15));
    updateLotLabels();
  </script>
</body>
</html>
